<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Scoped API keys — MCP Pro</title>
<style>
  :root {
    --ink: #1a1a1a;
    --ink-mute: #6e6e6e;
    --line: #1a1a1a;
    --line-soft: #cfcfcf;
    --bg: #ffffff;
    --bg-soft: #fafaf7;
    --accent: #9b99ff;
    --accent-soft: #efeeff;
    --warn: #d97757;
    --warn-soft: #fbeee6;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif;
    font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 1080px;
    margin: 0 auto;
    padding: 32px 32px 40px;
  }

  .block {
    margin-bottom: 32px;
  }
  .block:last-child { margin-bottom: 0; }

  .label {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    margin: 0 0 12px;
  }
  .label-before { background: var(--warn-soft); color: var(--warn); }
  .label-after  { background: var(--accent-soft); color: var(--accent); }

  .diagram {
    background: var(--bg-soft);
    border: 1px solid var(--line-soft);
    border-radius: 16px;
    padding: 32px;
  }

  .diagram svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .node-rect {
    fill: #ffffff;
    stroke: var(--line);
    stroke-width: 1.5;
  }
  .node-rect.accent {
    stroke: var(--accent);
    stroke-width: 2;
  }
  .node-rect.muted {
    stroke: var(--line-soft);
  }
  .node-label {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    font-size: 14px;
    font-weight: 500;
    fill: var(--ink);
  }
  .node-sub {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    font-size: 11px;
    fill: var(--ink-mute);
  }
  .link {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .link-dashed {
    stroke: var(--ink-mute);
    stroke-width: 1.5;
    stroke-dasharray: 4 4;
    fill: none;
  }
  .link-accent {
    stroke: var(--accent);
    stroke-width: 2;
    fill: none;
  }
</style>
</head>
<body>
  <main class="page">

    <section class="block">
      <span class="label label-before">Before</span>
      <div class="diagram">
        <svg viewBox="0 0 1000 200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Before diagram">
          <g>
            <rect class="node-rect" x="20"  y="70" width="140" height="60" rx="10"/>
            <text class="node-label" x="90" y="100" text-anchor="middle">App</text>
            <text class="node-sub"   x="90" y="118" text-anchor="middle">Claude, n8n, cron…</text>
          </g>
          <g>
            <rect class="node-rect" x="210" y="70" width="140" height="60" rx="10"/>
            <text class="node-label" x="280" y="105" text-anchor="middle">API key</text>
          </g>
          <g>
            <rect class="node-rect" x="400" y="70" width="140" height="60" rx="10"/>
            <text class="node-label" x="470" y="105" text-anchor="middle">User</text>
          </g>
          <g>
            <rect class="node-rect" x="590" y="70" width="170" height="60" rx="10"/>
            <text class="node-label" x="675" y="105" text-anchor="middle">Access Groups</text>
          </g>
          <g>
            <rect class="node-rect" x="810" y="70" width="170" height="60" rx="10"/>
            <text class="node-label" x="895" y="105" text-anchor="middle">Access Rights</text>
          </g>

          <path class="link" d="M160 100 H210"/>
          <path class="link" d="M350 100 H400"/>
          <path class="link" d="M540 100 H590"/>
          <path class="link" d="M760 100 H810"/>
        </svg>
      </div>
    </section>

    <section class="block">
      <span class="label label-after">After</span>
      <div class="diagram">
        <svg viewBox="0 0 1000 280" preserveAspectRatio="xMidYMid meet" role="img" aria-label="After diagram">
          <g>
            <rect class="node-rect muted" x="210" y="20" width="140" height="56" rx="10"/>
            <text class="node-label" x="280" y="53" text-anchor="middle">User</text>
          </g>

          <g>
            <rect class="node-rect" x="20" y="160" width="140" height="60" rx="10"/>
            <text class="node-label" x="90" y="190" text-anchor="middle">App</text>
            <text class="node-sub"   x="90" y="208" text-anchor="middle">Claude, n8n, cron…</text>
          </g>
          <g>
            <rect class="node-rect accent" x="210" y="160" width="140" height="60" rx="10"/>
            <text class="node-label" x="280" y="190" text-anchor="middle">API Key 1</text>
            <text class="node-sub"   x="280" y="208" text-anchor="middle">scoped</text>
          </g>
          <g>
            <rect class="node-rect accent" x="400" y="160" width="160" height="60" rx="10"/>
            <text class="node-label" x="480" y="190" text-anchor="middle">User Role</text>
            <text class="node-sub"   x="480" y="208" text-anchor="middle">Role Based Access · OCA</text>
          </g>
          <g>
            <rect class="node-rect" x="610" y="160" width="170" height="60" rx="10"/>
            <text class="node-label" x="695" y="195" text-anchor="middle">Access Groups</text>
          </g>
          <g>
            <rect class="node-rect" x="830" y="160" width="150" height="60" rx="10"/>
            <text class="node-label" x="905" y="195" text-anchor="middle">Access Rights</text>
          </g>

          <path class="link-dashed" d="M160 190 H210"/>
          <path class="link-accent" d="M350 190 H400"/>
          <path class="link" d="M560 190 H610"/>
          <path class="link" d="M780 190 H830"/>
          <path class="link-dashed" d="M280 76 V160"/>
          <path class="link" d="M280 76 C 280 120, 480 120, 480 160"/>
        </svg>
      </div>
    </section>

  </main>
</body>
</html>

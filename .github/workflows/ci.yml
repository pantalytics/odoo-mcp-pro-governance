name: CI

on:
  push:
    branches: [main, "19.0"]
  pull_request:
    branches: [main, "19.0"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Odoo 19 module tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout module
        uses: actions/checkout@v4
        with:
          path: pan_mcp_pro_governance_repo

      - name: Checkout Odoo 19.0 (Community)
        uses: actions/checkout@v4
        with:
          repository: odoo/odoo
          ref: "19.0"
          path: odoo
          # Shallow clone is fine — we only need the source tree to import.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libldap2-dev libsasl2-dev libxml2-dev libxslt1-dev \
            libjpeg-dev zlib1g-dev libpq-dev libffi-dev libssl-dev \
            postgresql-client

      - name: Install Odoo Python dependencies
        working-directory: odoo
        run: |
          pip install --upgrade pip wheel
          pip install -r requirements.txt
          # Editable install so `python -m odoo` works.
          pip install -e .

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U odoo && break
            sleep 1
          done

      - name: Stage addon into addons path
        run: |
          mkdir -p extra-addons
          ln -s "$GITHUB_WORKSPACE/pan_mcp_pro_governance_repo/pan_mcp_pro_governance" \
                "$GITHUB_WORKSPACE/extra-addons/pan_mcp_pro_governance"

      - name: Install module + run tests
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: odoo
          PGPASSWORD: odoo
        run: |
          python -m odoo \
            --addons-path="$GITHUB_WORKSPACE/odoo/addons,$GITHUB_WORKSPACE/extra-addons" \
            --db_host=localhost --db_port=5432 --db_user=odoo --db_password=odoo \
            -d test_ci \
            -i pan_mcp_pro_governance \
            --test-enable --test-tags=/pan_mcp_pro_governance \
            --stop-after-init \
            --without-demo=True \
            --log-level=info \
            --workers=0 \
            --max-cron-threads=0

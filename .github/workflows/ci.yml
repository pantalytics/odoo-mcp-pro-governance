name: CI

on:
  push:
    branches: [main, "19.0"]
  pull_request:
    branches: [main, "19.0"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Odoo 19 module tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout module
        uses: actions/checkout@v4
        with:
          path: pan_mcp_pro_governance_repo

      - name: Checkout Odoo 19.0 (Community)
        uses: actions/checkout@v4
        with:
          repository: odoo/odoo
          ref: "19.0"
          path: odoo
          # Shallow clone is fine — we only need the source tree to import.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libldap2-dev libsasl2-dev libxml2-dev libxslt1-dev \
            libjpeg-dev zlib1g-dev libpq-dev libffi-dev libssl-dev \
            postgresql-client \
            chromium-browser
          # Odoo's HttpCase looks up the browser via `which chromium`/`google-chrome`.
          # Without this the web tours (test_governance_tour, test_lifecycle_tour)
          # silently skip and we lose the only end-to-end check we have.

      - name: Install Odoo Python dependencies
        working-directory: odoo
        run: |
          pip install --upgrade pip wheel
          pip install -r requirements.txt
          # Editable install so `python -m odoo` works.
          pip install -e .

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U odoo && break
            sleep 1
          done

      - name: Stage addons into addons path
        # Since v1.2.0 the OCA auditlog + base_user_role modules are
        # vendored in this repo as sibling addons (pan_mcp_auditlog,
        # pan_mcp_user_role). Link those — not the OCA originals,
        # which would clash on auditlog.rule / res.users.role.
        run: |
          mkdir -p extra-addons
          ln -s "$GITHUB_WORKSPACE/pan_mcp_pro_governance_repo/pan_mcp_pro_governance" \
                "$GITHUB_WORKSPACE/extra-addons/pan_mcp_pro_governance"
          ln -s "$GITHUB_WORKSPACE/pan_mcp_pro_governance_repo/pan_mcp_auditlog" \
                "$GITHUB_WORKSPACE/extra-addons/pan_mcp_auditlog"
          ln -s "$GITHUB_WORKSPACE/pan_mcp_pro_governance_repo/pan_mcp_user_role" \
                "$GITHUB_WORKSPACE/extra-addons/pan_mcp_user_role"

      - name: Fresh-install gate (App Store reviewer simulation)
        # No --test-enable. Just install on a clean DB without demo data.
        # This is what the Odoo App Store reviewer actually does; if it
        # fails the listing is rejected, so we keep it as a distinct
        # gate from the test run.
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: odoo
          PGPASSWORD: odoo
        run: |
          python -m odoo \
            --addons-path="$GITHUB_WORKSPACE/odoo/addons,$GITHUB_WORKSPACE/extra-addons" \
            --db_host=localhost --db_port=5432 --db_user=odoo --db_password=odoo \
            -d install_gate \
            -i pan_mcp_pro_governance \
            --stop-after-init \
            --without-demo=True \
            --log-level=info \
            --workers=0 \
            --max-cron-threads=0

      - name: Install module + run tests
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: odoo
          PGPASSWORD: odoo
        run: |
          python -m odoo \
            --addons-path="$GITHUB_WORKSPACE/odoo/addons,$GITHUB_WORKSPACE/extra-addons" \
            --db_host=localhost --db_port=5432 --db_user=odoo --db_password=odoo \
            -d test_ci \
            -i pan_mcp_pro_governance \
            --test-enable --test-tags=/pan_mcp_pro_governance \
            --stop-after-init \
            --without-demo=True \
            --log-level=info \
            --workers=0 \
            --max-cron-threads=0

  manifest-version:
    name: Manifest version bump check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version bumped if module files changed
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          # Files inside the addon (excluding docs-only / static description text).
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            'pan_mcp_pro_governance/*.py' \
            'pan_mcp_pro_governance/**/*.py' \
            'pan_mcp_pro_governance/**/*.xml' \
            'pan_mcp_pro_governance/**/*.csv' \
            ':!pan_mcp_pro_governance/static/description/*' \
            ':!pan_mcp_pro_governance/tests/*' \
            ':!pan_mcp_pro_governance/static/src/js/tours/*' \
            || true)
          if [ -z "$CHANGED" ]; then
            echo "No production code changes; manifest bump not required."
            exit 0
          fi
          echo "Changed module files:"
          echo "$CHANGED"
          MANIFEST_DIFF=$(git diff "$BASE_SHA" "$HEAD_SHA" -- \
            pan_mcp_pro_governance/__manifest__.py | grep -E '^\+\s*"version"' || true)
          if [ -z "$MANIFEST_DIFF" ]; then
            echo "::error::Production files changed but __manifest__.py version was not bumped. See CLAUDE.md Odoo 19 checklist."
            exit 1
          fi
          echo "Manifest version was bumped:"
          echo "$MANIFEST_DIFF"

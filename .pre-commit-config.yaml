# Vendored OCA addons live in pan_mcp_auditlog/ and pan_mcp_user_role/.
# Per ADR-013 they are kept close to upstream — only the folder name,
# manifest display name, and self-qualified XML refs are modified by us.
# Skipping lint over these folders preserves the verbatim-from-OCA policy
# and keeps re-vendoring on a new OCA release a simple folder swap.
exclude: ^(pan_mcp_auditlog|pan_mcp_user_role)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-xml
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/OCA/odoo-pre-commit-hooks
    rev: v0.1.1
    hooks:
      - id: oca-checks-odoo-module
      - id: oca-checks-po

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
